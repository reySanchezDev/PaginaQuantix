name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Prettier format seasonal files for review
        run: |
          npx prettier --write docs/halloween-tech-noir-2026.md src/styles/themes/halloween-ambient.css tests/halloween-effects.browser.mjs
          python3 -c 'import json,pathlib; paths=["docs/halloween-tech-noir-2026.md","src/styles/themes/halloween-ambient.css","tests/halloween-effects.browser.mjs"]; [print("FORMATTED_ORGANIC::"+json.dumps({"path":p,"content":pathlib.Path(p).read_text()},ensure_ascii=True)) for p in paths]'
      - run: npm run quality
