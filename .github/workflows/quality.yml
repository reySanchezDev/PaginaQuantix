name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Temporary Prettier output for seasonal restoration test
        run: |
          npx prettier --write tests/seasonal-restoration.browser.mjs
          python3 -c 'import json,pathlib; p="tests/seasonal-restoration.browser.mjs"; print("FORMATTED_RESTORATION::"+json.dumps({"path":p,"content":pathlib.Path(p).read_text()},ensure_ascii=True))'
      - run: npm run quality
