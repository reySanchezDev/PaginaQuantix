name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Normalize seasonal CSS and browser QA
        run: |
          npx prettier --write src/styles/themes/dia-de-muertos-premium.css tests/dia-de-muertos.browser.mjs
          python3 -c 'import pathlib,json; fs=["src/styles/themes/dia-de-muertos-premium.css","tests/dia-de-muertos.browser.mjs"]; [print("FORMATTED_DIA::"+json.dumps({"path":p,"content":pathlib.Path(p).read_text()},ensure_ascii=True)) for p in fs]'
      - run: npm run quality
