name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: |
          npx prettier --write docs/halloween-tech-noir-2026.md src/layouts/BaseLayout.astro src/styles/themes/halloween-tech-noir.css
          python3 -c 'import json,pathlib; fs=["docs/halloween-tech-noir-2026.md","src/layouts/BaseLayout.astro","src/styles/themes/halloween-tech-noir.css"]; [print("FORMATTED_FILE::"+json.dumps({"path":p,"content":pathlib.Path(p).read_text()},ensure_ascii=True)) for p in fs]'
          npm run quality
