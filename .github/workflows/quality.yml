name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Temporary Prettier export for seasonal notices
        run: |
          npx prettier --write src/layouts/BaseLayout.astro tests/dia-de-muertos.browser.mjs tests/seasonal-themes.test.mjs
          python3 -c 'import pathlib,json; files=["src/layouts/BaseLayout.astro","tests/dia-de-muertos.browser.mjs","tests/seasonal-themes.test.mjs"]; [print("FORMATTED_BANNER::"+json.dumps({"path":p,"content":pathlib.Path(p).read_text()},ensure_ascii=True)) for p in files]'
      - run: npm run quality
