name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Temporary Prettier output for browser test
        run: |
          npx prettier --write tests/halloween-effects.browser.mjs
          python3 -c 'import json,pathlib; p="tests/halloween-effects.browser.mjs"; print("FORMAT_TEST::"+json.dumps({"path":p,"content":pathlib.Path(p).read_text()}))'
      - run: npm run quality
