name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Temporary canonical Prettier capture
        run: |
          npx prettier --write tests/navidad.browser.mjs
          node -e 'console.log("FORMATTED_NAVIDAD::" + JSON.stringify(require("node:fs").readFileSync("tests/navidad.browser.mjs", "utf8")))'
      - run: npm run quality
