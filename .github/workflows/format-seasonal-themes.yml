name: Format seasonal theme files

on:
  push:
    branches:
      - chore/format-seasonal-themes

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Apply Prettier
        run: |
          npx prettier --write public/themes/runtime.js public/themes/scheduler.js src/layouts/BaseLayout.astro src/styles/themes/octubre-rosa.css tests/seasonal-themes.test.mjs
          git diff --check
      - name: Commit formatting
        run: |
          git config user.name "quantix-format-bot"
          git config user.email "quantix-format-bot@users.noreply.github.com"
          git add public/themes/runtime.js public/themes/scheduler.js src/layouts/BaseLayout.astro src/styles/themes/octubre-rosa.css tests/seasonal-themes.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m "style(theme): format seasonal theme sources"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
