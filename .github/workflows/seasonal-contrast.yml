name: Seasonal Contrast

on:
  pull_request:
    paths:
      - "src/components/**"
      - "src/styles/**"
      - "tests/halloween-contrast*"
      - "tests/halloween-web*"
      - "public/themes/halloween-tech-noir/**"
      - ".github/workflows/seasonal-contrast.yml"
  push:
    branches: [main]
    paths:
      - "src/components/**"
      - "src/styles/**"
      - "tests/halloween-contrast*"
      - "tests/halloween-web*"
      - "public/themes/halloween-tech-noir/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-contrast:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install browser for real CSS contrast checks
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Build and audit all generated pages at 1440 and 390 widths
        run: |
          npm run test:themes
          npm run build
          npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/astro-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4321/en/ > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4321/en/ > /dev/null
          node tests/halloween-contrast.browser.mjs
          node tests/halloween-web.browser.mjs
