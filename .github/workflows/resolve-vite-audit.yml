name: Repair lockfile security advisory

on:
  push:
    branches:
      - chore/resolve-vite-audit

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Apply compatible security updates to lockfile
        run: |
          npm audit fix --package-lock-only
          npm ci
          npm run quality
          git diff --check
      - name: Commit lockfile update
        run: |
          git config user.name "quantix-maintenance-bot"
          git config user.email "quantix-maintenance-bot@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix(deps): update vulnerable Vite dependency"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
