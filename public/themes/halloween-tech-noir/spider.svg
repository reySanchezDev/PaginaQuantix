<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120" fill="none" aria-hidden="true">
  <!-- Original minimal spider for Quantix: abdomen, cephalothorax and eight articulated legs. -->
  <defs>
    <radialGradient id="body" cx=".34" cy=".22" r=".85">
      <stop stop-color="#414148"/>
      <stop offset=".42" stop-color="#1d1d25"/>
      <stop offset="1" stop-color="#0b0c13"/>
    </radialGradient>
    <linearGradient id="rim" x1="16" y1="21" x2="105" y2="111" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c4b5ac" stop-opacity=".79"/>
      <stop offset=".65" stop-color="#8c858d" stop-opacity=".58"/>
      <stop offset="1" stop-color="#5d5964" stop-opacity=".48"/>
    </linearGradient>
    <g id="left-legs" stroke-linecap="round" stroke-linejoin="round">
      <path d="M51 62 43 53 34 34 20 21 8 16"/>
      <path d="M49 67 39 63 25 55 14 57 4 65"/>
      <path d="M50 75 38 77 26 87 16 98 13 113"/>
      <path d="M53 79 47 87 43 99 40 115"/>
    </g>
  </defs>
  <g stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#090a10" stroke-width="5.1">
      <use href="#left-legs"/>
      <use href="#left-legs" transform="translate(120 0) scale(-1 1)"/>
    </g>
    <g stroke="url(#rim)" stroke-width="2.2">
      <use href="#left-legs"/>
      <use href="#left-legs" transform="translate(120 0) scale(-1 1)"/>
    </g>
  </g>
  <ellipse cx="60" cy="49" rx="17.5" ry="22" fill="url(#body)" stroke="url(#rim)" stroke-width="1.45"/>
  <path d="M51 36q8-5 18 0" stroke="#c6b1a4" stroke-opacity=".27" stroke-width="1.1" stroke-linecap="round"/>
  <path d="M53 67q7-6 14 0" stroke="#69636a" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="60" cy="76" rx="11.5" ry="11" fill="#15151c" stroke="url(#rim)" stroke-width="1.35"/>
  <path d="M55 83 52 91M65 83 68 91" stroke="#8b8387" stroke-opacity=".63" stroke-width="1.7" stroke-linecap="round"/>
</svg>
