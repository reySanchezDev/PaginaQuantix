<svg xmlns="http://www.w3.org/2000/svg" width="720" height="108" viewBox="0 0 720 108" fill="none" role="presentation">
  <!-- Brass clips are fixed into the cream header; the cord hangs naturally between them. One gravity-shaped drape per pair of clips; seamless ends both y=16. -->
  <defs>
    <radialGradient id="warm-halo">
      <stop offset="0" stop-color="#ffe3a0" stop-opacity=".85"/>
      <stop offset=".38" stop-color="#efb85b" stop-opacity=".37"/>
      <stop offset="1" stop-color="#efb85b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    /* Soft, asynchronous warm LEDs. The cable itself never moves. */
    .lamp__aura {
      animation: qx-led-aura var(--led-duration) ease-in-out var(--led-delay) infinite;
    }
    .lamp__glass {
      animation: qx-led-glass var(--led-duration) ease-in-out var(--led-delay) infinite;
    }
    .lamp__filament {
      animation: qx-led-filament var(--led-duration) ease-in-out var(--led-delay) infinite;
    }
    @keyframes qx-led-aura {
      0%, 100% { opacity: .22; }
      23% { opacity: .68; }
      48% { opacity: .9; }
      64% { opacity: .6; }
      83% { opacity: .98; }
    }
    @keyframes qx-led-glass {
      0%, 100% { opacity: .78; }
      40% { opacity: 1; }
      70% { opacity: .88; }
    }
    @keyframes qx-led-filament {
      0%, 100% { opacity: .65; }
      42% { opacity: 1; }
      77% { opacity: .82; }
    }
    @media (prefers-reduced-motion: reduce) {
      .lamp__aura, .lamp__glass, .lamp__filament { animation: none; }
      .lamp__aura { opacity: .52; }
      .lamp__glass { opacity: .95; }
      .lamp__filament { opacity: .85; }
    }
  </style>
  <g data-anchor="1" transform="translate(0 0)">
    <rect x="-11" y="0.6" width="22" height="8" rx="2.5" fill="#dbc591" stroke="#8a6b43" stroke-width="1.5"/>
    <path d="M-7 8v5c0 4 3 6 7 6s7-2 7-6V8" fill="none" stroke="#9d7b49" stroke-width="2.2"/>
    <path d="M-7 8v5c0 4 3 6 7 6" fill="none" stroke="#efdbac" stroke-width=".85" opacity=".9"/>
    <circle cx="0" cy="4.4" r="2.1" fill="#6e5136" stroke="#f5dfaa" stroke-width=".65"/>
    <circle cx="0" cy="16" r="3.1" fill="#294037" stroke="#bfa46e" stroke-width="1.4"/>
  </g>
